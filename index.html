<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <section class="tag">
    <img src="./images/image-product-desktop.jpg" alt="" class="tag-img">
    <div class="tag1">
      <p class="tag1-h1">Perfume</p>
      <h2 class="tag1-h2">Gabrielle</h2>
      <h2 class="tag1-h3">Essence Eau</h2>
      <h2 class="tag1-h4">De Parfum</h2>
      <p class="tag1-p1">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.
      </p>
      <div class = "tag2">
      <h1 class="tag2-p1">$149.99</h1>
      <p class="tag2-p2">$169.99</p>
      </div>
      <div class="tag3">
        <img src="./images/icon-cart.svg" alt="" class="tag3-img">
        <p class="tag3-btn">Add to Cart</p>
      </div>
    </div>
  </section>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
